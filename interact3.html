<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COSMIC · cursor trails · random comets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050812;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: system-ui, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #050812;
            cursor: crosshair;
            touch-action: none;
        }
        .controls {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.6rem;
            background: rgba(10, 14, 26, 0.9);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: #8a8aaa;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 300;
            white-space: nowrap;
        }
        .controls button:hover {
            background: rgba(255,255,255,0.1);
            color: #dacada;
            border-color: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }
        .controls button.active {
            background: rgba(120, 80, 200, 0.25);
            border-color: rgba(120, 80, 200, 0.3);
            color: #dacada;
        }
        .controls button.danger {
            color: #ff6b6b;
            border-color: rgba(255, 80, 80, 0.2);
        }
        .controls button.danger:hover {
            background: rgba(255, 80, 80, 0.1);
            border-color: rgba(255, 80, 80, 0.3);
        }
        @media (max-width: 768px) {
            .controls { bottom: 0.8rem; padding: 0.4rem 0.8rem; gap: 0.4rem; width: 95%; }
            .controls button { font-size: 0.55rem; padding: 0.25rem 0.7rem; }
        }
    </style>
</head>
<body>
<canvas id="cosmicCanvas"></canvas>
<div class="controls">
    <button id="soundBtn" class="active">🔊 Sound</button>
    <button id="trailBtn" class="active">✨ Trail</button>
    <button id="cometBtn" class="active">☄️ Comets</button>
    <button id="resetBtn">🌀 Reset</button>
    <button id="explodeBtn" class="danger">💥 BOOM</button>
</div>
<script>
(function cursorTrails() {
    const canvas = document.getElementById('cosmicCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    let W, H;
    let mouseX = 0, mouseY = 0;
    let prevMouseX = 0, prevMouseY = 0;
    let time = 0;
    let soundOn = true;
    let trailOn = true;
    let cometsOn = true;
    let audioCtx = null;
    let frameId = null;
    let cometTimer = 0;
    
    // --- resize ---
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        mouseX = W/2;
        mouseY = H/2;
        prevMouseX = W/2;
        prevMouseY = H/2;
    }
    window.addEventListener('resize', resize);
    resize();
    
    // --- PLANETS ---
    class Planet {
        constructor() {
            this.x = 100 + Math.random() * (W - 200);
            this.y = 100 + Math.random() * (H - 200);
            this.size = 40 + Math.random() * 50;
            this.hue = 280 + Math.random() * 60;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = 0.2 + Math.random() * 0.3;
        }
        
        update() {
            this.angle += 0.005;
            this.x += Math.sin(this.angle + this.speed) * 0.3;
            this.y += Math.cos(this.angle * 0.7 + this.speed) * 0.3;
            
            if (this.x < this.size) this.x = this.size;
            if (this.x > W - this.size) this.x = W - this.size;
            if (this.y < this.size) this.y = this.size;
            if (this.y > H - this.size) this.y = H - this.size;
        }
        
        draw() {
            const r = this.size * (0.85 + Math.sin(time * 0.05 + this.angle) * 0.05);
            
            ctx.save();
            ctx.shadowColor = `hsla(${this.hue}, 70%, 60%, 0.12)`;
            ctx.shadowBlur = 45;
            
            const grad = ctx.createRadialGradient(
                this.x - r*0.3, this.y - r*0.3, r*0.1,
                this.x, this.y, r
            );
            grad.addColorStop(0, `hsl(${this.hue + 20}, 80%, 70%)`);
            grad.addColorStop(0.5, `hsl(${this.hue}, 70%, 50%)`);
            grad.addColorStop(1, `hsl(${this.hue - 30}, 60%, 25%)`);
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.shadowBlur = 8;
            ctx.translate(this.x, this.y);
            ctx.rotate(time * 0.02 + this.angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 1.5, r * 0.2, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `hsla(${this.hue + 20}, 60%, 70%, 0.12)`;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
    }
    
    // --- COMETS (random spawn) ---
    class Comet {
        constructor() {
            this.reset();
            this.trail = [];
        }
        
        reset() {
            // spawn from random edge
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { this.x = -30; this.y = Math.random() * H; }
            else if (side === 1) { this.x = W + 30; this.y = Math.random() * H; }
            else if (side === 2) { this.x = Math.random() * W; this.y = -30; }
            else { this.x = Math.random() * W; this.y = H + 30; }
            
            const angle = Math.random() * Math.PI * 2;
            const speed = 5 + Math.random() * 8;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.size = 2.5 + Math.random() * 3.5;
            this.hue = Math.random() * 360;
            this.life = 80 + Math.random() * 120;
            this.maxLife = this.life;
            this.trail = [];
            this.maxTrail = 20 + Math.floor(Math.random() * 15);
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 1.5;
            
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > this.maxTrail) {
                this.trail.shift();
            }
            
            return this.life <= 0 || this.x < -200 || this.x > W + 200 || 
                   this.y < -200 || this.y > H + 200;
        }
        
        draw() {
            // trail
            ctx.save();
            for (let i = 0; i < this.trail.length; i++) {
                const t = this.trail[i];
                const progress = i / this.trail.length;
                const alpha = progress * 0.6 * (this.life / this.maxLife);
                const size = this.size * (0.2 + progress * 0.8);
                ctx.beginPath();
                ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue + progress * 30}, 100%, 70%, ${alpha * 0.3})`;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${alpha * 0.05})`;
                ctx.shadowBlur = 15;
                ctx.fill();
            }
            ctx.restore();
            
            // comet head
            ctx.save();
            ctx.shadowColor = `hsla(${this.hue}, 100%, 70%, 0.5)`;
            ctx.shadowBlur = 35;
            
            const grad = ctx.createRadialGradient(
                this.x - this.size, this.y - this.size, 0,
                this.x, this.y, this.size * 2
            );
            grad.addColorStop(0, `hsl(${this.hue + 30}, 100%, 95%)`);
            grad.addColorStop(0.3, `hsl(${this.hue}, 100%, 75%)`);
            grad.addColorStop(1, `hsla(${this.hue - 20}, 80%, 50%, 0.5)`);
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.shadowBlur = 50;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
            ctx.restore();
        }
        
        checkCollision(planet) {
            const dx = this.x - planet.x;
            const dy = this.y - planet.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            return dist < this.size * 2 + planet.size * 0.4;
        }
    }
    
    // --- TRAIL PARTICLES (follow cursor) ---
    class TrailParticle {
        constructor(x, y) {
            this.x = x || mouseX;
            this.y = y || mouseY;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5 - 0.5;
            this.size = 1 + Math.random() * 3;
            this.life = 30 + Math.random() * 40;
            this.maxLife = this.life;
            this.hue = 280 + Math.random() * 80;
            this.type = Math.random() > 0.4 ? 'sparkle' : 'dust';
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.97;
            this.vy *= 0.97;
            this.vy -= 0.02; // slight float up
            this.life -= 0.6;
            
            return this.life <= 0;
        }
        
        draw() {
            const alpha = Math.min(1, this.life / this.maxLife * 2);
            
            if (this.type === 'sparkle') {
                ctx.save();
                ctx.globalAlpha = alpha * 0.6;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 80%, 0.3)`;
                ctx.shadowBlur = 15;
                const s = this.size * 0.7;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2 - Math.PI/2;
                    const r = i === 0 ? s : s * 0.4;
                    if (i === 0) ctx.moveTo(this.x + Math.cos(angle) * s, this.y + Math.sin(angle) * s);
                    else ctx.lineTo(this.x + Math.cos(angle) * (i % 2 === 0 ? s : s * 0.4), 
                                   this.y + Math.sin(angle) * (i % 2 === 0 ? s : s * 0.4));
                }
                ctx.closePath();
                ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${alpha * 0.5})`;
                ctx.fill();
                ctx.restore();
            } else {
                // dust
                ctx.save();
                ctx.globalAlpha = alpha * 0.15;
                const grad = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 2
                );
                grad.addColorStop(0, `hsla(${this.hue}, 70%, 70%, ${alpha * 0.2})`);
                grad.addColorStop(1, `hsla(${this.hue}, 50%, 50%, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
    }
    
    // --- BACKGROUND PARTICLES (ambient) ---
    class AmbientParticle {
        constructor() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.size = 0.5 + Math.random() * 1.5;
            this.speed = 0.1 + Math.random() * 0.2;
            this.angle = Math.random() * Math.PI * 2;
            this.hue = 280 + Math.random() * 60;
        }
        
        update() {
            this.angle += 0.01;
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            
            if (this.x < -10) this.x = W + 10;
            if (this.x > W + 10) this.x = -10;
            if (this.y < -10) this.y = H + 10;
            if (this.y > H + 10) this.y = -10;
        }
        
        draw() {
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.shadowColor = `hsla(${this.hue}, 70%, 70%, 0.1)`;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, 0.3)`;
            ctx.fill();
            ctx.restore();
        }
    }
    
    // --- create objects ---
    const planets = [];
    for (let i = 0; i < 4; i++) {
        planets.push(new Planet());
    }
    
    const comets = [];
    const trailParticles = [];
    const ambientParticles = [];
    for (let i = 0; i < 80; i++) {
        ambientParticles.push(new AmbientParticle());
    }
    
    // --- explosion ---
    function createExplosion(x, y, count, hue) {
        const num = Math.min(count || 30, 50);
        for (let i = 0; i < num; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 5;
            const p = new TrailParticle(x, y);
            p.vx = Math.cos(angle) * speed;
            p.vy = Math.sin(angle) * speed;
            p.life = 20 + Math.random() * 30;
            p.maxLife = p.life;
            p.hue = hue || Math.random() * 360;
            p.size = 1 + Math.random() * 4;
            trailParticles.push(p);
        }
        while (trailParticles.length > 300) trailParticles.shift();
    }
    
    // --- audio ---
    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                soundOn = false;
                document.getElementById('soundBtn').textContent = '🔇 No Audio';
            }
        }
    }
    
    function playChord() {
        if (!soundOn || !audioCtx) return;
        try {
            const base = 150 + Math.random() * 150;
            [0, 4, 7, 12].forEach((n, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = base * Math.pow(2, n/12);
                    gain.gain.value = 0.08 * (1 - i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }, i * 40);
            });
        } catch(e) { /* ignore */ }
    }
    
    function playExplosion() {
        if (!soundOn || !audioCtx) return;
        try {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = 200 + Math.random() * 300;
                    gain.gain.value = 0.03 * (1 - i/5);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                }, i * 12);
            }
        } catch(e) { /* ignore */ }
    }
    
    // --- interaction ---
    canvas.addEventListener('mousemove', (e) => {
        prevMouseX = mouseX;
        prevMouseY = mouseY;
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        // spawn trail particles
        if (trailOn) {
            const dist = Math.sqrt((mouseX - prevMouseX)**2 + (mouseY - prevMouseY)**2);
            const count = Math.min(Math.floor(dist / 3) + 1, 5);
            for (let i = 0; i < count; i++) {
                const p = new TrailParticle(
                    prevMouseX + (mouseX - prevMouseX) * (i / count),
                    prevMouseY + (mouseY - prevMouseY) * (i / count)
                );
                trailParticles.push(p);
            }
            while (trailParticles.length > 200) trailParticles.shift();
        }
    });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        prevMouseX = mouseX;
        prevMouseY = mouseY;
        mouseX = touch.clientX;
        mouseY = touch.clientY;
        
        if (trailOn) {
            const dist = Math.sqrt((mouseX - prevMouseX)**2 + (mouseY - prevMouseY)**2);
            const count = Math.min(Math.floor(dist / 3) + 1, 5);
            for (let i = 0; i < count; i++) {
                const p = new TrailParticle(
                    prevMouseX + (mouseX - prevMouseX) * (i / count),
                    prevMouseY + (mouseY - prevMouseY) * (i / count)
                );
                trailParticles.push(p);
            }
            while (trailParticles.length > 200) trailParticles.shift();
        }
    }, { passive: false });
    
    canvas.addEventListener('click', (e) => {
        initAudio();
        playChord();
        createExplosion(e.clientX, e.clientY, 35);
        // spawn comet from click position
        if (cometsOn && comets.length < 6) {
            const c = new Comet();
            c.x = e.clientX;
            c.y = e.clientY;
            const angle = Math.random() * Math.PI * 2;
            const speed = 6 + Math.random() * 5;
            c.vx = Math.cos(angle) * speed;
            c.vy = Math.sin(angle) * speed;
            comets.push(c);
        }
    });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        initAudio();
        playChord();
        createExplosion(touch.clientX, touch.clientY, 30);
        if (cometsOn && comets.length < 6) {
            const c = new Comet();
            c.x = touch.clientX;
            c.y = touch.clientY;
            const angle = Math.random() * Math.PI * 2;
            const speed = 6 + Math.random() * 5;
            c.vx = Math.cos(angle) * speed;
            c.vy = Math.sin(angle) * speed;
            comets.push(c);
        }
    }, { passive: false });
    
    // --- controls ---
    document.getElementById('soundBtn').addEventListener('click', function() {
        soundOn = !soundOn;
        this.textContent = soundOn ? '🔊 Sound' : '🔇 Sound';
        this.classList.toggle('active');
        if (soundOn) initAudio();
    });
    
    document.getElementById('trailBtn').addEventListener('click', function() {
        trailOn = !trailOn;
        this.textContent = trailOn ? '✨ Trail' : '✨ Off';
        this.classList.toggle('active');
    });
    
    document.getElementById('cometBtn').addEventListener('click', function() {
        cometsOn = !cometsOn;
        this.textContent = cometsOn ? '☄️ Comets' : '☄️ Off';
        this.classList.toggle('active');
        if (!cometsOn) comets.length = 0;
    });
    
    document.getElementById('resetBtn').addEventListener('click', function() {
        planets.forEach(p => {
            p.x = 100 + Math.random() * (W - 200);
            p.y = 100 + Math.random() * (H - 200);
        });
        comets.length = 0;
        trailParticles.length = 0;
        initAudio();
        playChord();
        cometTimer = 0;
    });
    
    document.getElementById('explodeBtn').addEventListener('click', function() {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const x = 100 + Math.random() * (W - 200);
                const y = 100 + Math.random() * (H - 200);
                createExplosion(x, y, 40, Math.random() * 360);
                playExplosion();
            }, i * 150);
        }
    });
    
    // --- main draw loop ---
    function draw() {
        time += 0.02;
        
        // Clear with fade trail
        ctx.fillStyle = 'rgba(5, 8, 18, 0.12)';
        ctx.fillRect(0, 0, W, H);
        
        // --- draw nebula ---
        ctx.save();
        ctx.globalAlpha = 0.012;
        for (let i = 0; i < 4; i++) {
            const x = W/2 + Math.sin(time * 0.02 + i * 1.5) * W * 0.3;
            const y = H/2 + Math.cos(time * 0.018 + i * 1.2) * H * 0.3;
            const r = 200 + Math.sin(time * 0.015 + i) * 60;
            const grad = ctx.createRadialGradient(x, y, 10, x, y, r);
            const colors = [
                ['#ff6b9d', '#ff0066'],
                ['#6b9dff', '#0066ff'],
                ['#9d6bff', '#6600ff'],
                ['#ff9d6b', '#ff6600']
            ];
            const [c1, c2] = colors[i % colors.length];
            grad.addColorStop(0, c1);
            grad.addColorStop(1, c2);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        
        // --- draw ambient particles ---
        for (const p of ambientParticles) {
            p.update();
            p.draw();
        }
        
        // --- update and draw planets ---
        for (const p of planets) {
            p.update();
            p.draw();
        }
        
        // --- spawn comets randomly ---
        if (cometsOn) {
            cometTimer -= 0.02;
            if (cometTimer <= 0 && comets.length < 5) {
                comets.push(new Comet());
                cometTimer = 60 + Math.random() * 180;
            }
            
            // update comets
            for (let i = comets.length - 1; i >= 0; i--) {
                const c = comets[i];
                const dead = c.update();
                
                // check collisions
                let hit = false;
                for (const p of planets) {
                    if (c.checkCollision(p)) {
                        createExplosion(c.x, c.y, 25, c.hue);
                        playExplosion();
                        const angle = Math.atan2(c.y - p.y, c.x - p.x);
                        p.x -= Math.cos(angle) * 30;
                        p.y -= Math.sin(angle) * 30;
                        hit = true;
                        break;
                    }
                }
                
                if (dead || hit) {
                    comets.splice(i, 1);
                } else {
                    c.draw();
                }
            }
        }
        
        // --- draw trail particles ---
        for (let i = trailParticles.length - 1; i >= 0; i--) {
            const p = trailParticles[i];
            const dead = p.update();
            if (dead) {
                trailParticles.splice(i, 1);
            } else {
                p.draw();
            }
        }
        
        // --- mouse glow (subtle) ---
        ctx.save();
        ctx.globalAlpha = 0.02;
        const mg = ctx.createRadialGradient(mouseX, mouseY, 10, mouseX, mouseY, 100);
        mg.addColorStop(0, 'rgba(255, 200, 255, 0.2)');
        mg.addColorStop(1, 'rgba(255, 200, 255, 0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 100, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        // --- HUD ---
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.font = '9px monospace';
        ctx.fillText(`✦ ${planets.length} planets · ${comets.length} comets · ${trailParticles.length} particles ✦`, 15, 25);
        ctx.fillText(`next comet: ${Math.round(cometTimer/60)}s`, 15, 38);
        
        frameId = requestAnimationFrame(draw);
    }
    
    draw();
    
    // init audio on first interaction
    document.addEventListener('click', () => initAudio(), { once: true });
    document.addEventListener('touchstart', () => initAudio(), { once: true });
    
    // cleanup
    window.addEventListener('beforeunload', () => {
        if (frameId) cancelAnimationFrame(frameId);
        if (audioCtx) audioCtx.close();
    });
    
})();
</script>
</body>
</html>
