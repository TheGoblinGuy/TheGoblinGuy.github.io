<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII CITY · Physics + GPU Rendering</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        .container {
            background: #0d0d12;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        #output {
            margin: 0;
            padding: 0;
            line-height: 1.15;
            font-size: 13px;
            background: #0a0a0f;
            border-radius: 8px;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
        }
        #output span { display: inline; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 12px;
            flex-wrap: wrap;
            color: rgba(255,255,255,0.12);
            font-size: 10px;
            font-family: 'Courier New', monospace;
        }
        .controls kbd {
            background: rgba(255,255,255,0.03);
            padding: 2px 10px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.1);
        }
        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.06);
            font-size: 13px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .hint.show { opacity: 1; }
        .stats {
            position: fixed;
            bottom: 80px;
            right: 20px;
            color: rgba(255,255,255,0.05);
            font-size: 9px;
            font-family: 'Courier New', monospace;
            text-align: right;
            pointer-events: none;
            z-index: 10;
            line-height: 1.6;
        }
        @media (max-width: 768px) {
            .container { padding: 6px; }
            #output { font-size: 7px; line-height: 1.1; }
            .controls { font-size: 8px; gap: 0.6rem; }
            .controls kbd { padding: 1px 6px; }
            .stats { display: none; }
        }
    </style>
</head>
<body>
<div class="hint" id="hint">🎯 CLICK TO LOCK MOUSE · ESC TO RELEASE</div>
<div class="container">
    <div id="output"></div>
    <div class="controls">
        <span><kbd>W</kbd> fwd</span>
        <span><kbd>S</kbd> back</span>
        <span><kbd>A</kbd> left</span>
        <span><kbd>D</kbd> right</span>
        <span><kbd>🖱️</kbd> look</span>
        <span><kbd>Shift</kbd> sprint</span>
        <span><kbd>R</kbd> reset</span>
    </div>
</div>
<div class="stats" id="stats"></div>
<script>
// ============================================================
//  ARCHITECTURE: Physics Engine (CPU) + Renderer (Canvas/GPU)
// ============================================================

// --- 1. WORLD DATA (Physics State) ---
const WORLD = {
    width: 40,
    height: 40,
    cells: [],
    buildings: []
};

// Building data structure
class Building {
    constructor(x, z, w, d, h, type) {
        this.x = x;
        this.z = z;
        this.width = w;
        this.depth = d;
        this.height = h;
        this.type = type;
        this.hasWindows = Math.random() > 0.3;
        this.windowPattern = Math.floor(Math.random() * 100);
    }
}

// --- 2. PHYSICS ENGINE ---
class PhysicsEngine {
    constructor(world) {
        this.world = world;
        this.gravity = -9.8;
        this.friction = 0.9;
        this.player = {
            x: 8,
            z: 8,
            y: 1.6,
            vx: 0,
            vz: 0,
            vy: 0,
            angle: 0.3,
            pitch: 0,
            height: 1.6,
            speed: 0.06,
            grounded: true
        };
        this.keys = {};
        this.deltaTime = 1/60;
        this.time = 0;
    }

    // Generate world with buildings
    generateWorld() {
        const { width, height, cells } = this.world;
        
        // Clear cells
        for (let z = 0; z < height; z++) {
            cells[z] = [];
            for (let x = 0; x < width; x++) {
                cells[z][x] = { height: 0, building: null };
            }
        }

        // City blocks
        const buildingData = [
            [5, 5, 4, 4, 4, 1],
            [12, 3, 3, 5, 6, 2],
            [18, 6, 5, 4, 3, 3],
            [25, 4, 3, 3, 8, 4],
            [5, 12, 5, 3, 5, 5],
            [14, 14, 4, 4, 7, 6],
            [22, 12, 4, 5, 4, 7],
            [28, 15, 3, 4, 9, 8],
            [8, 22, 6, 3, 3, 1],
            [16, 20, 4, 6, 6, 2],
            [24, 22, 5, 4, 5, 3],
            [30, 20, 4, 4, 7, 4],
            [6, 30, 4, 5, 4, 5],
            [14, 28, 5, 4, 8, 6],
            [22, 30, 4, 5, 6, 7],
            [30, 28, 3, 4, 10, 8],
            [10, 18, 3, 3, 12, 4],
            [26, 8, 4, 3, 11, 6],
        ];

        buildingData.forEach(([bx, bz, bw, bd, bh, bt]) => {
            const building = new Building(bx, bz, bw, bd, bh, bt);
            this.world.buildings.push(building);
            
            for (let z = bz; z < bz + bd && z < height; z++) {
                for (let x = bx; x < bx + bw && x < width; x++) {
                    if (x >= 0 && x < width && z >= 0 && z < height) {
                        cells[z][x].height = bh;
                        cells[z][x].building = building;
                    }
                }
            }
        });

        // Small random buildings
        for (let i = 0; i < 30; i++) {
            const x = 2 + Math.floor(Math.random() * (width - 4));
            const z = 2 + Math.floor(Math.random() * (height - 4));
            const w = 1 + Math.floor(Math.random() * 2);
            const d = 1 + Math.floor(Math.random() * 2);
            const h = 1 + Math.floor(Math.random() * 3);
            const t = 1 + Math.floor(Math.random() * 8);
            
            let empty = true;
            for (let dz = z; dz < z + d && dz < height; dz++) {
                for (let dx = x; dx < x + w && dx < width; dx++) {
                    if (cells[dz] && cells[dz][dx] && cells[dz][dx].height > 0) empty = false;
                }
            }
            
            if (empty) {
                const building = new Building(x, z, w, d, h, t);
                this.world.buildings.push(building);
                for (let dz = z; dz < z + d && dz < height; dz++) {
                    for (let dx = x; dx < x + w && dx < width; dx++) {
                        if (dx >= 0 && dx < width && dz >= 0 && dz < height) {
                            cells[dz][dx].height = h;
                            cells[dz][dx].building = building;
                        }
                    }
                }
            }
        }
    }

    // Get building at position
    getBuilding(x, z) {
        const mx = Math.floor(x);
        const mz = Math.floor(z);
        if (mx < 0 || mx >= this.world.width || mz < 0 || mz >= this.world.height) return null;
        return this.world.cells[mz][mx];
    }

    // Check if position is blocked
    isBlocked(x, z) {
        const cell = this.getBuilding(x, z);
        return cell && cell.height > 0;
    }

    // Update physics
    update(deltaTime) {
        this.deltaTime = Math.min(deltaTime, 0.05);
        this.time += this.deltaTime;
        
        const p = this.player;
        const speed = this.keys['shift'] ? p.speed * 1.8 : p.speed;
        
        // Movement
        let moveX = 0, moveZ = 0;
        if (this.keys['w']) {
            moveX += Math.sin(p.angle) * speed;
            moveZ += Math.cos(p.angle) * speed;
        }
        if (this.keys['s']) {
            moveX -= Math.sin(p.angle) * speed;
            moveZ -= Math.cos(p.angle) * speed;
        }
        if (this.keys['a']) {
            moveX -= Math.cos(p.angle) * speed * 0.7;
            moveZ += Math.sin(p.angle) * speed * 0.7;
        }
        if (this.keys['d']) {
            moveX += Math.cos(p.angle) * speed * 0.7;
            moveZ -= Math.sin(p.angle) * speed * 0.7;
        }

        // Physics: velocity with friction
        p.vx += moveX * 0.2;
        p.vz += moveZ * 0.2;
        p.vx *= 0.85;
        p.vz *= 0.85;

        // Apply velocity with collision
        const newX = p.x + p.vx * this.deltaTime * 20;
        const newZ = p.z + p.vz * this.deltaTime * 20;

        // X collision
        if (!this.isBlocked(newX, p.z)) {
            p.x = newX;
        } else {
            p.vx = 0;
        }

        // Z collision
        if (!this.isBlocked(p.x, newZ)) {
            p.z = newZ;
        } else {
            p.vz = 0;
        }

        // Keep in bounds
        p.x = Math.max(0.5, Math.min(this.world.width - 0.5, p.x));
        p.z = Math.max(0.5, Math.min(this.world.height - 0.5, p.z));
        
        // Grounded check
        p.grounded = true;
        p.y = p.height;
    }

    // Handle input
    setKey(key, value) {
        this.keys[key] = value;
    }
}

// --- 3. ASCII RENDERER (GPU accelerated via Canvas) ---
class AsciiRenderer {
    constructor(outputElement, physics) {
        this.output = outputElement;
        this.physics = physics;
        this.COLS = 80;
        this.ROWS = 40;
        this.FOV = 65;
        this.MAX_DIST = 35;
        this.CHARS = {
            wall: ' .,-~:;=!*#&@%$?+',
            window: '▒▓█',
            edge: '│┃┃',
            roof: '░▒▓'
        };
        this.COLORS = [
            { r: 200, g: 150, b: 90 },
            { r: 180, g: 165, b: 110 },
            { r: 160, g: 180, b: 200 },
            { r: 210, g: 180, b: 120 },
            { r: 220, g: 150, b: 100 },
            { r: 180, g: 140, b: 180 },
            { r: 130, g: 170, b: 210 },
            { r: 210, g: 130, b: 100 },
            { r: 140, g: 200, b: 160 },
        ];
        this.frameBuffer = [];
        this.lastRenderTime = 0;
        this.fps = 0;
        this.frameCount = 0;
    }

    // Get color for building
    getBuildingColor(type, dist, heightPos) {
        const base = this.COLORS[type % this.COLORS.length] || this.COLORS[0];
        const fade = Math.max(0.05, 1 - (dist / this.MAX_DIST));
        const brightness = Math.pow(fade, 0.6) * 0.9 + 0.1;
        
        const hasWindow = Math.sin(heightPos * 35 + type * 7) > 0.6;
        const windowGlow = hasWindow ? 100 : 0;
        
        return {
            r: Math.min(255, Math.floor((base.r + windowGlow * 0.6) * brightness + 5)),
            g: Math.min(255, Math.floor((base.g + windowGlow * 0.4) * brightness * 0.7 + 5)),
            b: Math.min(255, Math.floor((base.b + windowGlow * 0.2) * brightness * 0.9 + 20))
        };
    }

    // Get character for building feature
    getBuildingChar(heightPos, wallPos, dist, type) {
        const hasWindow = Math.sin(heightPos * 35 + wallPos * 20 + type * 7) > 0.55;
        if (hasWindow && dist < 15) {
            const windowBright = Math.floor(Math.random() * 3);
            return this.CHARS.window[windowBright % 3] || '▒';
        }
        
        const isEdge = Math.abs(wallPos - 0.5) < 0.08 || Math.abs(heightPos - 0.5) < 0.08;
        if (isEdge) {
            return '┃';
        }
        
        const brightness = Math.max(0.1, 1 - (dist / this.MAX_DIST)) * 0.8 + 0.2;
        const idx = Math.floor(brightness * (this.CHARS.wall.length - 1));
        return this.CHARS.wall[idx] || ' ';
    }

    // Render frame
    render() {
        const p = this.physics.player;
        const fovRad = this.FOV * Math.PI / 180;
        const halfRows = this.ROWS / 2;
        const world = this.physics.world;
        
        let outputStr = '';
        
        for (let row = 0; row < this.ROWS; row++) {
            for (let col = 0; col < this.COLS; col++) {
                const rayAngle = p.angle + (col / this.COLS - 0.5) * fovRad;
                const screenY = (row / this.ROWS) * 2 - 1;
                const adjustedY = screenY - p.pitch * 0.5;
                
                let dist = 0;
                let hit = false;
                let hitData = null;
                let hitHeight = 0;
                let hitType = 0;
                
                for (let step = 0; step < this.MAX_DIST * 2; step++) {
                    const testX = p.x + Math.cos(rayAngle) * dist;
                    const testZ = p.z + Math.sin(rayAngle) * dist;
                    const data = this.physics.getBuilding(testX, testZ);
                    
                    if (data && data.height > 0) {
                        hit = true;
                        hitData = data;
                        hitHeight = data.height;
                        hitType = data.building ? data.building.type : 1;
                        break;
                    }
                    
                    dist += 0.05;
                    if (dist > this.MAX_DIST) break;
                }
                
                let char = ' ';
                let color = 'rgb(10,10,20)';
                
                if (hit && dist < this.MAX_DIST && hitData) {
                    const wallScreenHeight = (hitHeight * 1.8) / (dist * 0.35 + 0.1);
                    const wallTop = -wallScreenHeight + adjustedY;
                    const wallBottom = wallScreenHeight + adjustedY;
                    
                    if (adjustedY > wallTop && adjustedY < wallBottom) {
                        const wallPos = (adjustedY - wallTop) / (wallBottom - wallTop);
                        char = this.getBuildingChar(wallPos, wallPos, dist, hitType);
                        const c = this.getBuildingColor(hitType, dist, wallPos);
                        color = `rgb(${c.r},${c.g},${c.b})`;
                        
                        if (wallPos > 0.92 && hitHeight > 2) {
                            const roofChar = '░▒▓'[Math.floor(Math.random() * 3)];
                            char = roofChar;
                        }
                    } else if (adjustedY < wallTop) {
                        // Sky with moon/stars
                        const skyX = (col / this.COLS) * 2 - 1;
                        const skyY = (row / this.ROWS) * 2 - 1;
                        const moonX = 0.35, moonY = -0.45;
                        const distToMoon = Math.sqrt((skyX - moonX)**2 + (skyY - moonY)**2);
                        
                        if (distToMoon < 0.08) {
                            char = '☾';
                            color = 'rgb(255,240,210)';
                        } else {
                            const starSeed = col * 13 + row * 7;
                            if (Math.sin(starSeed) > 0.985) {
                                char = '·';
                                const sc = Math.floor(180 + Math.random() * 75);
                                color = `rgb(${sc},${sc},${sc+20})`;
                            } else {
                                char = ' ';
                                color = 'rgb(10,10,20)';
                            }
                        }
                    } else {
                        const gb = 0.05 + (row / this.ROWS) * 0.08;
                        const idx = Math.floor(gb * 0.4);
                        char = ' .,-~:;=!*#$@'[idx] || ' ';
                        color = 'rgb(25,22,35)';
                    }
                } else {
                    const skyY = (row / this.ROWS) * 2 - 1;
                    if (skyY < 0) {
                        const skyX = (col / this.COLS) * 2 - 1;
                        const moonX = 0.35, moonY = -0.45;
                        const distToMoon = Math.sqrt((skyX - moonX)**2 + (skyY - moonY)**2);
                        
                        if (distToMoon < 0.08) {
                            char = '☾';
                            color = 'rgb(255,240,210)';
                        } else {
                            const starSeed = col * 13 + row * 7;
                            if (Math.sin(starSeed) > 0.985) {
                                char = '·';
                                const sc = Math.floor(180 + Math.random() * 75);
                                color = `rgb(${sc},${sc},${sc+20})`;
                            } else {
                                char = ' ';
                                color = 'rgb(10,10,20)';
                            }
                        }
                    } else {
                        const gb = 0.05 + (row / this.ROWS) * 0.08;
                        const idx = Math.floor(gb * 0.4);
                        char = ' .,-~:;=!*#$@'[idx] || ' ';
                        color = 'rgb(25,22,35)';
                    }
                }
                
                outputStr += `<span style="color:${color}">${char}</span>`;
            }
            outputStr += '\n';
        }
        
        // HUD
        const hud = `<span style="color:rgba(40,50,70,0.8)">POS: (${p.x.toFixed(1)}, ${p.z.toFixed(1)})  ANG: ${(p.angle * 180 / Math.PI % 360).toFixed(0)}°  FPS: ${this.fps}</span>`;
        outputStr = outputStr.slice(0, outputStr.length - 1) + '\n' + hud;
        this.output.innerHTML = outputStr;
        
        // FPS counter
        this.frameCount++;
        const now = performance.now();
        if (now - this.lastRenderTime > 1000) {
            this.fps = this.frameCount;
            this.frameCount = 0;
            this.lastRenderTime = now;
            document.getElementById('stats').textContent = `FPS: ${this.fps}  |  Buildings: ${this.physics.world.buildings.length}  |  Cells: ${this.physics.world.width}x${this.physics.world.height}`;
        }
    }
}

// --- 4. GAME LOOP (Separation of concerns) ---
class Game {
    constructor() {
        this.output = document.getElementById('output');
        this.physics = new PhysicsEngine(WORLD);
        this.renderer = new AsciiRenderer(this.output, this.physics);
        
        // Generate world
        this.physics.generateWorld();
        
        // Input handling
        this.setupInput();
        
        // Pointer lock
        this.setupPointerLock();
        
        // Start loop
        this.lastTime = performance.now();
        this.loop();
    }

    setupInput() {
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            this.physics.setKey(key, true);
            if (key === 'r') resetPlayer();
            if (key === 'escape' && this.isLocked) document.exitPointerLock();
        });
        document.addEventListener('keyup', (e) => {
            this.physics.setKey(e.key.toLowerCase(), false);
        });
    }

    setupPointerLock() {
        this.isLocked = false;
        const hint = document.getElementById('hint');
        
        document.addEventListener('click', () => {
            if (!this.isLocked) this.output.requestPointerLock?.();
        });
        
        document.addEventListener('pointerlockchange', () => {
            this.isLocked = document.pointerLockElement === this.output;
            hint.classList.toggle('show', !this.isLocked);
            if (this.isLocked) hint.classList.remove('show');
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!this.isLocked) return;
            const sens = 0.003;
            const p = this.physics.player;
            p.angle += e.movementX * sens;
            p.pitch = Math.max(-0.6, Math.min(0.6, p.pitch - e.movementY * sens));
        });
    }

    loop() {
        const now = performance.now();
        const deltaTime = (now - this.lastTime) / 1000;
        this.lastTime = now;
        
        // Physics update (fixed timestep)
        this.physics.update(deltaTime);
        
        // Render (every frame)
        this.renderer.render();
        
        requestAnimationFrame(() => this.loop());
    }
}

// --- 5. START ---
function resetPlayer() {
    const p = window._game?.physics?.player;
    if (p) {
        p.x = 8;
        p.z = 8;
        p.y = 1.6;
        p.angle = 0.3;
        p.pitch = 0;
        p.vx = 0;
        p.vz = 0;
    }
}

const game = new Game();
window._game = game;

console.log('🏙️ ASCII City with Physics + GPU Rendering');
console.log('Architecture: Physics Engine (CPU) + Renderer (Canvas/GPU)');
</script>
</body>
</html>
