<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COSMIC ODYSSEY · 4K · particles · comets · collisions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: system-ui, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #050812;
            cursor: crosshair;
            touch-action: none;
        }
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(10, 14, 26, 0.85);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #8a8aaa;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 300;
            white-space: nowrap;
        }
        .controls button:hover {
            background: rgba(255,255,255,0.08);
            color: #dacada;
            border-color: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }
        .controls button.active {
            background: rgba(120, 80, 200, 0.2);
            border-color: rgba(120, 80, 200, 0.3);
            color: #dacada;
        }
        .controls button.danger {
            color: #ff6b6b;
            border-color: rgba(255, 80, 80, 0.2);
        }
        .controls button.danger:hover {
            background: rgba(255, 80, 80, 0.1);
            border-color: rgba(255, 80, 80, 0.3);
        }
        .hud {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            color: rgba(255,255,255,0.06);
            font-size: 0.7rem;
            font-family: monospace;
            text-align: right;
            pointer-events: none;
            z-index: 50;
            letter-spacing: 1px;
        }
        @media (max-width: 768px) {
            .controls { bottom: 1rem; padding: 0.6rem 1rem; gap: 0.5rem; width: 95%; }
            .controls button { font-size: 0.6rem; padding: 0.3rem 0.8rem; }
            .hud { display: none; }
        }
    </style>
</head>
<body>
<canvas id="cosmicCanvas"></canvas>
<div class="hud">✦  COSMIC ODYSSEY  ✦</div>
<div class="controls">
    <button id="soundBtn" class="active">🔊 Sound</button>
    <button id="particleBtn" class="active">✨ Particles</button>
    <button id="cometBtn" class="active">☄️ Comets</button>
    <button id="resetBtn">🌀 Reset</button>
    <button id="explodeBtn" class="danger">💥 EXPLODE</button>
</div>
<script>
(function cosmicOdyssey() {
    const canvas = document.getElementById('cosmicCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    let W, H;
    let mouseX, mouseY;
    let time = 0;
    let soundOn = true;
    let particlesOn = true;
    let cometsOn = true;
    let audioCtx = null;
    let frameId = null;
    
    // --- resize ---
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        mouseX = W/2;
        mouseY = H/2;
    }
    window.addEventListener('resize', resize);
    resize();
    
    // --- planet class (roaming) ---
    class RoamingPlanet {
        constructor() {
            this.reset();
            this.size = 60 + Math.random() * 80;
            this.hue = Math.random() * 60 + 280;
            this.speed = 0.2 + Math.random() * 0.3;
            this.orbitRadius = 200 + Math.random() * 300;
            this.angleOffset = Math.random() * Math.PI * 2;
            this.ringPulse = Math.random() * 0.5;
        }
        
        reset() {
            this.x = 100 + Math.random() * (W - 200);
            this.y = 100 + Math.random() * (H - 200);
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
        }
        
        update() {
            // gentle roaming with sine wave
            this.x += Math.sin(time * 0.02 + this.angleOffset) * 0.3;
            this.y += Math.cos(time * 0.025 + this.angleOffset * 0.7) * 0.3;
            
            // avoid edges
            if (this.x < this.size) { this.x = this.size; }
            if (this.x > W - this.size) { this.x = W - this.size; }
            if (this.y < this.size) { this.y = this.size; }
            if (this.y > H - this.size) { this.y = H - this.size; }
            
            this.angleOffset += 0.001;
        }
        
        draw() {
            const px = this.x;
            const py = this.y;
            const pr = this.size * (0.8 + Math.sin(time * 0.1 + this.angleOffset) * 0.05);
            
            // glow
            ctx.save();
            ctx.shadowColor = `hsla(${this.hue}, 70%, 60%, 0.15)`;
            ctx.shadowBlur = 80;
            ctx.beginPath();
            ctx.arc(px, py, pr, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(px - pr*0.3, py - pr*0.3, pr*0.1, px, py, pr);
            grad.addColorStop(0, `hsl(${this.hue + 20}, 80%, 70%)`);
            grad.addColorStop(0.4, `hsl(${this.hue}, 70%, 50%)`);
            grad.addColorStop(0.7, `hsl(${this.hue - 20}, 60%, 35%)`);
            grad.addColorStop(1, `hsl(${this.hue - 40}, 50%, 20%)`);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
            
            // rings
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(time * 0.03 + this.angleOffset);
            const rp = Math.sin(time * 0.1 + this.ringPulse) * 5;
            ctx.shadowColor = 'rgba(200, 150, 255, 0.05)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.ellipse(0, 0, pr * 1.6 + rp, pr * 0.25 + Math.sin(time*0.08 + this.ringPulse)*2, 0, 0, Math.PI*2);
            ctx.strokeStyle = `hsla(${this.hue + 20}, 60%, 70%, ${0.15 + Math.sin(time*0.1 + this.ringPulse)*0.05})`;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(0, 0, pr * 1.8 + rp*1.2, pr * 0.3 + Math.sin(time*0.07 + this.ringPulse)*2.5, 0, 0, Math.PI*2);
            ctx.strokeStyle = `hsla(${this.hue + 40}, 50%, 60%, ${0.1 + Math.sin(time*0.08 + this.ringPulse)*0.04})`;
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.restore();
        }
    }
    
    // --- comet class ---
    class Comet {
        constructor() {
            this.reset();
            this.trail = [];
            this.maxTrail = 40 + Math.random() * 30;
        }
        
        reset() {
            // spawn from edges
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { this.x = -20; this.y = Math.random() * H; }
            else if (side === 1) { this.x = W + 20; this.y = Math.random() * H; }
            else if (side === 2) { this.x = Math.random() * W; this.y = -20; }
            else { this.x = Math.random() * W; this.y = H + 20; }
            
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 5;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.size = 2 + Math.random() * 4;
            this.hue = 30 + Math.random() * 30; // warm colors
            this.life = 300 + Math.random() * 400;
            this.maxLife = this.life;
            this.trail = [];
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.5;
            
            // trail
            this.trail.push({x: this.x, y: this.y, life: 1});
            if (this.trail.length > this.maxTrail) {
                this.trail.shift();
            }
            this.trail.forEach(t => t.life -= 0.03);
            
            // check if dead
            if (this.life <= 0 || this.x < -100 || this.x > W+100 || this.y < -100 || this.y > H+100) {
                this.reset();
                return true;
            }
            return false;
        }
        
        draw() {
            // trail
            ctx.save();
            for (let i = 0; i < this.trail.length; i++) {
                const t = this.trail[i];
                const alpha = (i / this.trail.length) * 0.6 * t.life;
                const size = this.size * (i / this.trail.length) * 0.8;
                ctx.beginPath();
                ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha * 0.3})`;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${alpha * 0.1})`;
                ctx.shadowBlur = 20;
                ctx.fill();
            }
            ctx.restore();
            
            // comet head
            ctx.save();
            ctx.shadowColor = `hsla(${this.hue}, 100%, 70%, 0.5)`;
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(
                this.x - this.size, this.y - this.size, 0,
                this.x, this.y, this.size * 2
            );
            grad.addColorStop(0, `hsl(${this.hue + 20}, 100%, 90%)`);
            grad.addColorStop(0.4, `hsl(${this.hue}, 100%, 70%)`);
            grad.addColorStop(1, `hsla(${this.hue - 20}, 80%, 50%, 0.5)`);
            ctx.fillStyle = grad;
            ctx.fill();
            
            // bright core
            ctx.shadowBlur = 60;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
            ctx.restore();
        }
        
        checkCollision(planet) {
            const dx = this.x - planet.x;
            const dy = this.y - planet.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < this.size * 2 + planet.size * 0.5) {
                return true;
            }
            return false;
        }
    }
    
    // --- particle system (smoke/dust + sparkle) ---
    class DustParticle {
        constructor(x, y, vx, vy, color, size) {
            this.x = x || Math.random() * W;
            this.y = y || Math.random() * H;
            this.vx = vx || (Math.random() - 0.5) * 0.3;
            this.vy = vy || (Math.random() - 0.5) * 0.3;
            this.size = size || 1 + Math.random() * 4;
            this.maxSize = this.size;
            this.life = 80 + Math.random() * 120;
            this.maxLife = this.life;
            this.hue = color || 280 + Math.random() * 60;
            this.type = Math.random() > 0.7 ? 'sparkle' : 'dust';
            this.gravity = (Math.random() - 0.5) * 0.01;
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.vx *= 0.999;
            this.vy *= 0.999;
            this.life -= 0.2;
            
            if (this.type === 'sparkle') {
                this.size = this.maxSize * (0.5 + Math.sin(time * 0.1 + this.x) * 0.5);
            }
            
            if (this.life <= 0 || this.x < -50 || this.x > W+50 || this.y < -50 || this.y > H+50) {
                this.reset();
            }
        }
        
        reset() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.3;
            this.life = 80 + Math.random() * 120;
            this.maxLife = this.life;
            this.size = 1 + Math.random() * 4;
            this.maxSize = this.size;
            this.hue = 280 + Math.random() * 60;
            this.type = Math.random() > 0.7 ? 'sparkle' : 'dust';
        }
        
        draw() {
            const alpha = Math.min(1, this.life / this.maxLife * 2);
            ctx.save();
            
            if (this.type === 'sparkle') {
                ctx.globalAlpha = alpha * 0.6;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 80%, 0.3)`;
                ctx.shadowBlur = 20;
                const s = this.size * 0.8;
                // star shape
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2 - Math.PI/2;
                    const r = i === 0 ? s : s * 0.4;
                    if (i === 0) ctx.moveTo(this.x + Math.cos(angle) * s, this.y + Math.sin(angle) * s);
                    else ctx.lineTo(this.x + Math.cos(angle) * (i % 2 === 0 ? s : s * 0.4), 
                                   this.y + Math.sin(angle) * (i % 2 === 0 ? s : s * 0.4));
                }
                ctx.closePath();
                ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${alpha * 0.5})`;
                ctx.fill();
            } else {
                // dust/smoke
                ctx.globalAlpha = alpha * 0.15;
                ctx.shadowColor = `hsla(${this.hue}, 50%, 50%, 0.05)`;
                ctx.shadowBlur = 30;
                const grad = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 2
                );
                grad.addColorStop(0, `hsla(${this.hue}, 70%, 70%, ${alpha * 0.2})`);
                grad.addColorStop(1, `hsla(${this.hue}, 50%, 50%, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }
    
    // --- init objects ---
    const planets = [];
    for (let i = 0; i < 5; i++) {
        planets.push(new RoamingPlanet());
    }
    
    const comets = [];
    for (let i = 0; i < 8; i++) {
        comets.push(new Comet());
    }
    
    const dustParticles = [];
    for (let i = 0; i < 300; i++) {
        dustParticles.push(new DustParticle());
    }
    
    // --- collision effects ---
    function createExplosion(x, y, size, color) {
        for (let i = 0; i < size * 3; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 6;
            const p = new DustParticle(
                x + (Math.random() - 0.5) * 20,
                y + (Math.random() - 0.5) * 20,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                color || 280 + Math.random() * 60,
                1 + Math.random() * 5
            );
            p.life = 60 + Math.random() * 80;
            p.maxLife = p.life;
            p.type = Math.random() > 0.5 ? 'sparkle' : 'dust';
            dustParticles.push(p);
        }
        while (dustParticles.length > 800) dustParticles.shift();
        playExplosionSound();
    }
    
    function playExplosionSound() {
        if (!soundOn || !audioCtx) return;
        try {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = 100 + Math.random() * 400;
                    gain.gain.value = 0.03 * (1 - i/8);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                }, i * 20);
            }
        } catch(e) { /* ignore */ }
    }
    
    // --- audio ---
    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                soundOn = false;
                document.getElementById('soundBtn').textContent = '🔇 No Audio';
            }
        }
    }
    
    function playTone(freq, duration, vol) {
        if (!soundOn || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.value = vol * 0.05;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) { /* ignore */ }
    }
    
    function playChord() {
        if (!soundOn || !audioCtx) return;
        const base = 150 + Math.random() * 200;
        [0, 4, 7, 12, 16].forEach((n, i) => {
            setTimeout(() => {
                playTone(base * Math.pow(2, n/12), 0.5, 0.15 - i * 0.02);
            }, i * 50);
        });
    }
    
    // --- interaction ---
    canvas.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        mouseX = touch.clientX;
        mouseY = touch.clientY;
    }, { passive: false });
    
    canvas.addEventListener('click', (e) => {
        initAudio();
        playChord();
        createExplosion(e.clientX, e.clientY, 30, 30 + Math.random() * 30);
    });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        initAudio();
        playChord();
        createExplosion(touch.clientX, touch.clientY, 25, 30 + Math.random() * 30);
    }, { passive: false });
    
    // --- controls ---
    document.getElementById('soundBtn').addEventListener('click', function() {
        soundOn = !soundOn;
        this.textContent = soundOn ? '🔊 Sound' : '🔇 Sound';
        this.classList.toggle('active');
        if (soundOn) initAudio();
    });
    
    document.getElementById('particleBtn').addEventListener('click', function() {
        particlesOn = !particlesOn;
        this.textContent = particlesOn ? '✨ Particles' : '✨ Off';
        this.classList.toggle('active');
    });
    
    document.getElementById('cometBtn').addEventListener('click', function() {
        cometsOn = !cometsOn;
        this.textContent = cometsOn ? '☄️ Comets' : '☄️ Off';
        this.classList.toggle('active');
    });
    
    document.getElementById('resetBtn').addEventListener('click', function() {
        planets.forEach(p => p.reset());
        comets.forEach(c => c.reset());
        dustParticles.length = 0;
        for (let i = 0; i < 300; i++) dustParticles.push(new DustParticle());
        initAudio();
        playChord();
    });
    
    document.getElementById('explodeBtn').addEventListener('click', function() {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const x = 100 + Math.random() * (W - 200);
                const y = 100 + Math.random() * (H - 200);
                createExplosion(x, y, 40 + Math.random() * 30, Math.random() * 360);
            }, i * 200);
        }
    });
    
    // --- main loop ---
    function draw() {
        time += 0.02;
        
        // clear with subtle fade
        ctx.fillStyle = 'rgba(5, 8, 18, 0.15)';
        ctx.fillRect(0, 0, W, H);
        
        // --- background nebula ---
        ctx.save();
        ctx.globalAlpha = 0.015;
        for (let i = 0; i < 6; i++) {
            const x = W/2 + Math.sin(time * 0.03 + i * 1.5) * W * 0.35;
            const y = H/2 + Math.cos(time * 0.025 + i * 1.2) * H * 0.35;
            const r = 200 + Math.sin(time * 0.02 + i) * 80;
            const grad = ctx.createRadialGradient(x, y, 10, x, y, r);
            const colors = [
                ['#ff6b9d', '#ff0066'],
                ['#6b9dff', '#0066ff'],
                ['#9d6bff', '#6600ff'],
                ['#ff9d6b', '#ff6600'],
                ['#6bff9d', '#00ff66'],
                ['#ff6bff', '#ff00aa']
            ];
            const [c1, c2] = colors[i % colors.length];
            grad.addColorStop(0, c1);
            grad.addColorStop(1, c2);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        
        // --- draw planets ---
        planets.forEach(p => {
            p.update();
            p.draw();
        });
        
        // --- draw comets ---
        if (cometsOn) {
            comets.forEach(c => {
                const died = c.update();
                c.draw();
                
                // check collisions with planets
                planets.forEach(p => {
                    if (c.checkCollision(p)) {
                        createExplosion(c.x, c.y, 20, c.hue);
                        c.reset();
                        // push planet
                        const angle = Math.atan2(c.y - p.y, c.x - p.x);
                        p.x -= Math.cos(angle) * 30;
                        p.y -= Math.sin(angle) * 30;
                    }
                });
            });
        }
        
        // --- draw dust particles ---
        if (particlesOn) {
            dustParticles.forEach(p => {
                p.update();
                p.draw();
            });
        }
        
        // --- mouse glow ---
        ctx.save();
        ctx.globalAlpha = 0.03;
        const mg = ctx.createRadialGradient(mouseX, mouseY, 10, mouseX, mouseY, 150);
        mg.addColorStop(0, 'rgba(255, 200, 255, 0.3)');
        mg.addColorStop(1, 'rgba(255, 200, 255, 0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 150, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        
        // --- HUD ---
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.font = '10px monospace';
        ctx.fillText(`✦ ${planets.length} planets · ${comets.length} comets · ${dustParticles.length} particles ✦`, 20, 30);
        ctx.fillText(`fps: ${Math.round(60)}`, 20, 45);
        
        frameId = requestAnimationFrame(draw);
    }
    
    draw();
    
    // init audio
    document.addEventListener('click', () => initAudio(), { once: true });
    document.addEventListener('touchstart', () => initAudio(), { once: true });
    
    // cleanup
    window.addEventListener('beforeunload', () => {
        if (frameId) cancelAnimationFrame(frameId);
        if (audioCtx) audioCtx.close();
    });
    
})();
</script>
</body>
</html>
