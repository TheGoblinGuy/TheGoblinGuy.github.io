<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stable cosmic · interactive + sound</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #060812;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
            padding: 1rem;
        }
        .card {
            background: #0b0f1a;
            padding: 1rem;
            border-radius: 2.5rem;
            box-shadow: 0 24px 48px rgba(0,0,0,0.9);
        }
        canvas {
            display: block;
            width: 600px;
            height: 600px;
            border-radius: 2rem;
            background: #0a0e1a;
            cursor: pointer;
            touch-action: none;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .controls button {
            background: #1a1f30;
            border: 1px solid #2a2f40;
            color: #8a8aaa;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .controls button:hover {
            background: #2a2f48;
            color: #cacada;
            border-color: #4a4f6a;
        }
        .controls button.active {
            background: #2a2f5a;
            border-color: #6a4f8a;
            color: #dacada;
        }
        .caption {
            text-align: center;
            margin-top: 0.6rem;
            color: #4a4a6a;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }
        @media (max-width: 650px) {
            .card { padding: 0.6rem; border-radius: 1.8rem; }
            canvas { width: 100%; height: auto; aspect-ratio: 1/1; border-radius: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <canvas id="stableCanvas" width="600" height="600"></canvas>
    <div class="controls">
        <button id="soundBtn" class="active">🔊 Sound</button>
        <button id="particleBtn" class="active">✨ Particles</button>
        <button id="resetBtn">🌀 Reset</button>
    </div>
    <div class="caption">✦  move · click · listen  ✦</div>
</div>
<script>
(function stableCosmic() {
    const canvas = document.getElementById('stableCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    let w = 600, h = 600;
    let mouseX = w/2, mouseY = h/2;
    let clickX = w/2, clickY = h/2;
    let time = 0;
    let soundOn = true;
    let particlesOn = true;
    let audioCtx = null;
    let frameId = null;
    
    // --- particle system (simplified for stability) ---
    class Particle {
        constructor(x, y) {
            this.x = x || Math.random() * w;
            this.y = y || Math.random() * h;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.8;
            this.speedY = (Math.random() - 0.5) * 0.8;
            this.life = Math.random() * 80 + 40;
            this.maxLife = this.life;
            this.hue = 280 + Math.random() * 60;
        }
        
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.3;
            
            // gentle mouse attraction
            const dx = mouseX - this.x;
            const dy = mouseY - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
                const force = (120 - dist) / 120 * 0.03;
                this.x += dx * force;
                this.y += dy * force;
            }
            
            if (this.life <= 0 || this.x < -10 || this.x > w+10 || this.y < -10 || this.y > h+10) {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.life = this.maxLife;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
            }
        }
        
        draw() {
            const alpha = Math.min(1, this.life / this.maxLife * 2);
            ctx.save();
            ctx.globalAlpha = alpha * 0.5;
            ctx.shadowColor = `hsla(${this.hue}, 70%, 70%, 0.2)`;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${alpha * 0.4})`;
            ctx.fill();
            ctx.restore();
        }
    }
    
    const particles = [];
    for (let i = 0; i < 100; i++) {
        particles.push(new Particle());
    }
    
    // --- audio (simplified, more stable) ---
    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.log('Audio not supported');
                soundOn = false;
                document.getElementById('soundBtn').textContent = '🔇 No Audio';
            }
        }
    }
    
    function playTone(freq, duration, vol) {
        if (!soundOn || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.value = vol * 0.08;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) { /* ignore */ }
    }
    
    function playChord() {
        if (!soundOn || !audioCtx) return;
        const base = 200 + Math.random() * 200;
        [0, 4, 7, 12].forEach((n, i) => {
            setTimeout(() => {
                playTone(base * Math.pow(2, n/12), 0.4, 0.2 - i * 0.03);
            }, i * 60);
        });
    }
    
    function playShimmer() {
        if (!soundOn || !audioCtx || Math.random() > 0.3) return;
        for (let i = 0; i < 4; i++) {
            setTimeout(() => {
                playTone(400 + Math.random() * 600, 0.04, 0.02);
            }, i * 15);
        }
    }
    
    // --- interaction ---
    function handleMove(x, y) {
        mouseX = Math.max(0, Math.min(w, x));
        mouseY = Math.max(0, Math.min(h, y));
        playShimmer();
    }
    
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        handleMove((e.clientX - rect.left) * sx, (e.clientY - rect.top) * sy);
    });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        const touch = e.touches[0];
        handleMove((touch.clientX - rect.left) * sx, (touch.clientY - rect.top) * sy);
    }, { passive: false });
    
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        clickX = (e.clientX - rect.left) * sx;
        clickY = (e.clientY - rect.top) * sy;
        initAudio();
        playChord();
        
        // burst
        for (let i = 0; i < 15; i++) {
            const p = new Particle(
                clickX + (Math.random() - 0.5) * 40,
                clickY + (Math.random() - 0.5) * 40
            );
            p.speedX = (Math.random() - 0.5) * 5;
            p.speedY = (Math.random() - 0.5) * 5;
            p.size = Math.random() * 4 + 2;
            p.hue = Math.random() * 360;
            particles.push(p);
        }
        while (particles.length > 200) particles.shift();
    });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        const touch = e.touches[0];
        clickX = (touch.clientX - rect.left) * sx;
        clickY = (touch.clientY - rect.top) * sy;
        initAudio();
        playChord();
        for (let i = 0; i < 12; i++) {
            const p = new Particle(
                clickX + (Math.random() - 0.5) * 30,
                clickY + (Math.random() - 0.5) * 30
            );
            p.speedX = (Math.random() - 0.5) * 4;
            p.speedY = (Math.random() - 0.5) * 4;
            p.size = Math.random() * 3 + 1.5;
            p.hue = Math.random() * 360;
            particles.push(p);
        }
        while (particles.length > 200) particles.shift();
    }, { passive: false });
    
    // --- controls ---
    document.getElementById('soundBtn').addEventListener('click', function() {
        soundOn = !soundOn;
        this.textContent = soundOn ? '🔊 Sound' : '🔇 Sound';
        this.classList.toggle('active');
        if (soundOn) initAudio();
    });
    
    document.getElementById('particleBtn').addEventListener('click', function() {
        particlesOn = !particlesOn;
        this.textContent = particlesOn ? '✨ Particles' : '✨ Off';
        this.classList.toggle('active');
    });
    
    document.getElementById('resetBtn').addEventListener('click', function() {
        mouseX = w/2;
        mouseY = h/2;
        particles.length = 0;
        for (let i = 0; i < 100; i++) particles.push(new Particle());
        initAudio();
        playChord();
    });
    
    // --- main loop (stable frame rate) ---
    function draw() {
        time += 0.02;
        
        // clear with fade
        ctx.fillStyle = 'rgba(10, 14, 26, 0.3)';
        ctx.fillRect(0, 0, w, h);
        
        // --- nebula clouds (gentle) ---
        ctx.save();
        ctx.globalAlpha = 0.02;
        for (let i = 0; i < 4; i++) {
            const x = 300 + Math.sin(time * 0.08 + i * 1.8) * 180;
            const y = 300 + Math.cos(time * 0.06 + i * 1.5) * 180;
            const r = 130 + Math.sin(time * 0.04 + i) * 30;
            const grad = ctx.createRadialGradient(x, y, 10, x, y, r);
            const colors = [
                ['#ff6b9d', '#ff0066'],
                ['#6b9dff', '#0066ff'],
                ['#9d6bff', '#6600ff'],
                ['#ff9d6b', '#ff6600']
            ];
            const [c1, c2] = colors[i % colors.length];
            grad.addColorStop(0, c1);
            grad.addColorStop(1, c2);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        
        // --- planet ---
        const px = 300 + (mouseX - 300) * 0.04;
        const py = 300 + (mouseY - 300) * 0.04;
        const pr = 85 + Math.sin(time * 0.2) * 3;
        
        ctx.save();
        ctx.shadowColor = `hsla(${280 + Math.sin(time) * 15}, 70%, 60%, 0.15)`;
        ctx.shadowBlur = 50;
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        const pg = ctx.createRadialGradient(px - 20, py - 20, 15, px, py, pr);
        pg.addColorStop(0, `hsl(${330 + Math.sin(time*0.1)*15}, 80%, 65%)`);
        pg.addColorStop(0.4, `hsl(${300 + Math.sin(time*0.08)*15}, 70%, 50%)`);
        pg.addColorStop(0.7, `hsl(${270 + Math.sin(time*0.06)*15}, 60%, 35%)`);
        pg.addColorStop(1, `hsl(${240 + Math.sin(time*0.04)*15}, 50%, 20%)`);
        ctx.fillStyle = pg;
        ctx.fill();
        ctx.restore();
        
        // --- rings ---
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(time * 0.04);
        const rp = Math.sin(time * 0.15) * 3;
        ctx.shadowColor = 'rgba(200, 150, 255, 0.03)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(0, 0, 125 + rp, 20 + Math.sin(time*0.2)*2, 0, 0, Math.PI*2);
        ctx.strokeStyle = `hsla(${300 + Math.sin(time*0.08)*15}, 60%, 70%, ${0.12 + Math.sin(time*0.15)*0.04})`;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(0, 0, 140 + rp, 25 + Math.sin(time*0.18)*2.5, 0, 0, Math.PI*2);
        ctx.strokeStyle = `hsla(${320 + Math.sin(time*0.1)*15}, 50%, 60%, ${0.08 + Math.sin(time*0.12)*0.03})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
        
        // --- particles ---
        if (particlesOn) {
            particles.forEach(p => {
                p.update();
                p.draw();
            });
        }
        
        // --- mouse glow ---
        ctx.save();
        ctx.globalAlpha = 0.04;
        const mg = ctx.createRadialGradient(mouseX, mouseY, 5, mouseX, mouseY, 80);
        mg.addColorStop(0, 'rgba(255, 200, 255, 0.2)');
        mg.addColorStop(1, 'rgba(255, 200, 255, 0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 80, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        
        // --- tiny label ---
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.font = '9px monospace';
        ctx.fillText('✦ cosmic dream ✦', 470, 585);
        
        frameId = requestAnimationFrame(draw);
    }
    
    // start
    draw();
    
    // init audio on first user interaction
    document.addEventListener('click', () => initAudio(), { once: true });
    document.addEventListener('touchstart', () => initAudio(), { once: true });
    
    // cleanup
    window.addEventListener('beforeunload', () => {
        if (frameId) cancelAnimationFrame(frameId);
        if (audioCtx) audioCtx.close();
    });
    
})();
</script>
</body>
</html>
